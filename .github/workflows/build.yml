name: Build

on:
  push:
    branches:
      - port/gtnh-1.7.10
  pull_request:
    branches:
      - port/gtnh-1.7.10

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version and repository contents
        id: version
        run: python3 tools/ci/check_build_version.py

      - name: Set up JDK 8 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 25 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          log=$(mktemp)
          for attempt in 1 2 3; do
            if ./gradlew build --no-daemon --stacktrace \
              -Porg.gradle.java.installations.paths="$JAVA_HOME_8_X64" 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq 'Received status code (429|502|503|504) from server' "$log"; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      - name: Upload JARs
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dangomusicce-jars
          path: build/libs/*.jar
          if-no-files-found: error
