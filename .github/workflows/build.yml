name: Build

on:
  push:
    branches:
      - port/neoforge-1.21.x
  pull_request:
    branches:
      - port/neoforge-1.21.x

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version and repository contents
        id: version
        run: python3 tools/ci/check_build_version.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          log=$(mktemp)
          for attempt in 1 2 3; do
            if ./gradlew :core:check :1.21.1-neoforge:build --no-daemon --stacktrace --max-workers=2 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq 'Received status code (429|502|503|504) from server' "$log"; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      - name: Upload JARs
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dangomusicce-neoforge-1.21.x-jars
          path: |
            versions/*/build/libs/*+*.jar
            !versions/*/build/libs/*-dev-shadow.jar
          if-no-files-found: error
